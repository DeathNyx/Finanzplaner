<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Zeichensatz, damit Umlaute (ä, ö, ü) richtig angezeigt werden -->
  <meta charset="UTF-8">
  <!-- Sorgt dafür, dass die Seite am Handy nicht winzig klein dargestellt wird -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Finanzplaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Kopfzeile: zeigt den Namen des aktuellen Bildschirms -->
  <header class="kopf">
    <h1 id="titel">Finanzplaner</h1>
  </header>

  <!-- Hier wird der Inhalt des jeweiligen Bildschirms eingesetzt -->
  <main id="inhalt" class="inhalt"></main>

  <!-- Navigationsleiste unten. Jeder Knopf ändert die Adresse (z. B. #kassen) -->
  <nav class="navi">
    <a href="#uebersicht" data-ziel="uebersicht">
      <span class="symbol">🏠</span>
      <span>Übersicht</span>
    </a>
    <a href="#kassen" data-ziel="kassen">
      <span class="symbol">💰</span>
      <span>Kassen</span>
    </a>
    <a href="#buchen" data-ziel="buchen" class="plus">
      <span class="symbol">+</span>
      <span>Buchen</span>
    </a>
    <a href="#monat" data-ziel="monat">
      <span class="symbol">📅</span>
      <span>Monat</span>
    </a>
    <a href="#mehr" data-ziel="mehr">
      <span class="symbol">☰</span>
      <span>Mehr</span>
    </a>
  </nav>

  <!-- Reihenfolge ist wichtig: erst die Werkzeuge, dann der Start -->
  <script src="js/format.js"></script>
  <script src="js/speicher.js"></script>
  <script src="js/rechnen.js"></script>
  <script src="js/ansichten.js"></script>
  <script src="js/personen.js"></script>
  <script src="js/kassen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
